{% extends "base.html" %}

{% block title %}Sign In - CareerAI{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 40px auto;">
    <div class="card" style="padding: 36px;">
        <div style="text-align: center; margin-bottom: 28px;">
            <div class="nav-brand-icon" style="margin: 0 auto 16px; width: 48px; height: 48px;">
                <span style="font-size: 1.5rem;">🔐</span>
            </div>
            <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em;">
                Welcome Back
            </h1>
            <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 4px;">
                Sign in to access your personal profile and career logs.
            </p>
        </div>

        <form action="/login" method="POST">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; color: var(--text-main);">
                    Email Address
                </label>
                <input type="email" id="loginEmail" name="email" required placeholder="name@example.com"
                    style="width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
                    onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
            </div>

            <div style="margin-bottom: 24px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label style="font-weight: 700; font-size: 0.9rem; color: var(--text-main);">
                        Password
                    </label>
                </div>
                <input type="password" id="loginPassword" name="password" required placeholder="••••••••"
                    style="width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
                    onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--border)'">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; font-weight: 700;">
                <span>Sign In</span>
            </button>
        </form>

        <!-- Quick Demo Fill Buttons -->
        <div style="margin-top: 28px; padding-top: 20px; border-top: 1px dashed var(--border);">
            <div style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-light); text-align: center; margin-bottom: 12px;">
                ⚡ Quick Fill Demo Accounts
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn btn-secondary" style="flex: 1; padding: 8px 10px; font-size: 0.8rem;" onclick="fillDemo('admin@careerai.com', 'admin123')">
                    👑 Admin Demo
                </button>
                <button type="button" class="btn btn-secondary" style="flex: 1; padding: 8px 10px; font-size: 0.8rem;" onclick="fillDemo('priya.tiwari050706@gmail.com', 'password123')">
                    👤 User Demo
                </button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? 
            <a href="/register" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create one now</a>
        </div>
    </div>
</div>

<script>
    function fillDemo(email, pass) {
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPassword').value = pass;
    }
</script>
{% endblock %}
